<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opponents | Build-A-Politician</title>
<meta name="description" content="Pick who your candidate runs against, or let one be chosen for you.">
<link rel="icon" href="assets/icons/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="loading-screen" aria-hidden="true"><div class="loading-seal"></div><span class="loading-text">Loading</span></div>

<header class="site-header">
  <div class="container nav-row">
    <a class="brand" href="index.html"><img class="brand-mark" src="assets/icons/logo-mark.svg" alt="" aria-hidden="true">Build-A-Politician</a>
    <nav aria-label="Primary">
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="create.html">Create Candidate</a></li>
        <li><a href="simulator.html">Simulator</a></li>
        <li><a href="how-it-works.html">How It Works</a></li>
      </ul>
    </nav>
    <div class="nav-tools">
      <button class="theme-pill" data-theme-toggle aria-pressed="false">Dark</button>
      <button class="nav-burger" aria-label="Menu" aria-expanded="false">&#9776;</button>
    </div>
  </div>
</header>

<main id="main">
  <div class="container section-tight">
    <h1>Pick an opponent</h1>
    <p class="lead mb-2">Optional. Skip this and one will be chosen for you.</p>

    <div class="card card-pad mb-2" id="currentOpponent" style="display:none;">
      <div class="flex-between">
        <div>
          <p class="eyebrow" style="margin:0;">Running against</p>
          <strong id="currentOpponentName"></strong>
        </div>
        <button type="button" class="btn secondary small" id="clearOpponentBtn">Clear</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-target="tab-roster">Choose from a list</button>
      <button class="tab-btn" data-target="tab-custom">Build your own</button>
    </div>

    <div class="tab-panel active" id="tab-roster">
      <div class="search-bar">
        <input type="text" id="rosterSearch" placeholder="Search by name, party, job or issue" aria-label="Search opponents">
      </div>
      <p id="rosterMessage" class="small muted" role="status"></p>
      <div class="grid grid-3 mt-1" id="rosterGrid" role="list"></div>
    </div>

    <div class="tab-panel" id="tab-custom">
      <div class="creator-layout">
        <form id="opponentForm">
          <section class="card step-card">
            <div class="step-label"><span class="num">1</span><h2>Basics</h2></div>
            <div class="form-grid">
              <div class="field"><label for="oppNameInput">Name</label><input type="text" id="oppNameInput" placeholder="Morgan Prescott" autocomplete="off"></div>
              <div class="field"><label for="oppPartyInput">Party</label><input type="text" id="oppPartyInput" placeholder="Heritage Party" autocomplete="off"></div>
              <div class="field"><label for="oppAgeInput">Age</label><input type="number" id="oppAgeInput" min="25" max="90" value="52"></div>
              <div class="field"><label for="oppStateSelect">Home state</label><select id="oppStateSelect"></select></div>
              <div class="field"><label for="oppOccupationInput">Occupation before politics</label><input type="text" id="oppOccupationInput" placeholder="Governor" autocomplete="off"></div>
              <div class="field"><label for="oppIssueSelect">Top issue</label><select id="oppIssueSelect"></select></div>
              <div class="field full">
                <label for="oppSloganInput">Slogan</label>
                <div class="input-row">
                  <input type="text" id="oppSloganInput" placeholder="A New Chapter Starts Now" autocomplete="off">
                  <button type="button" class="btn secondary" id="oppRandomSloganBtn">Random</button>
                </div>
              </div>
            </div>
          </section>

          <section class="card step-card">
            <div class="step-label"><span class="num">2</span><h2>About them</h2><span class="hint">3 to 5 sentences</span></div>
            <textarea id="oppAboutInput" aria-label="About the opponent"
              placeholder="Morgan Prescott is a careful, well-prepared official who has never lost an election. They ran because they believe steady hands beat loud voices. Supporters call them dependable; critics call them dull."></textarea>
          </section>

          <div class="card card-pad">
            <div class="button-row">
              <button type="button" class="btn" id="oppSaveBtn">Save opponent</button>
              <button type="button" class="btn secondary" id="oppRandomizeBtn">Random</button>
            </div>
            <p id="oppFormMessage" class="form-msg" role="status"></p>
          </div>
        </form>

        <aside class="rail">
          <div class="candidate-card" id="oppPreviewCard"></div>
        </aside>
      </div>
    </div>

    <div class="text-center mt-3">
      <a class="btn large" href="simulator.html">Run the simulation</a>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-row">
    <ul class="footer-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="create.html">Create</a></li>
      <li><a href="results.html">Results</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
    <div class="button-row">
      <button class="btn ghost small" data-sound-toggle aria-pressed="true">Sound: on</button>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/opponent.js"></script>
</body>
</html>
