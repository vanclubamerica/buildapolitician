<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results | Build-A-Politician</title>
<meta name="description" content="The full breakdown of your candidate's simulated election.">
<link rel="icon" href="assets/icons/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="loading-screen" aria-hidden="true"><div class="loading-seal"></div><span class="loading-text">Loading</span></div>
<div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

<header class="site-header">
  <div class="container nav-row">
    <a class="brand" href="index.html"><img class="brand-mark" src="assets/icons/logo-mark.svg" alt="" aria-hidden="true">Build-A-Politician</a>
    <nav aria-label="Primary">
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="create.html">Create Candidate</a></li>
        <li><a href="simulator.html">Simulator</a></li>
        <li><a href="how-it-works.html">How It Works</a></li>
      </ul>
    </nav>
    <div class="nav-tools">
      <button class="theme-pill" data-theme-toggle aria-pressed="false">Dark</button>
      <button class="nav-burger" aria-label="Menu" aria-expanded="false">&#9776;</button>
    </div>
  </div>
</header>

<main id="main">
  <div class="container section-tight">

    <div class="card empty" id="resultsMissing" style="display:none;">
      <h2>No results yet</h2>
      <p>Run the simulation and the breakdown lands here.</p>
      <div class="button-row" style="justify-content:center;">
        <a class="btn" href="simulator.html">Go to the simulator</a>
        <a class="btn secondary" href="create.html">Create a candidate</a>
      </div>
    </div>

    <div id="resultsWrap" style="display:none;">
      <div class="flex-between mb-2">
        <div>
          <h1 id="winnerBannerText" style="margin-bottom:.25rem;"></h1>
          <p class="lead" id="winnerBannerSub" style="margin:0;"></p>
          <p class="tiny mt-1" id="ranAtNote"></p>
        </div>
        <div class="button-row">
          <a class="btn secondary small" href="create.html">Edit</a>
          <a class="btn small" href="simulator.html">Run again</a>
          <button class="btn secondary small" id="printResultsBtn">Print</button>
          <button class="btn secondary small" id="downloadResultsBtn">Download</button>
        </div>
      </div>

      <div class="results-layout">
        <div class="candidate-card" id="resultCandidateCard"></div>
        <div id="reportRoot"></div>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-row">
    <ul class="footer-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="create.html">Create</a></li>
      <li><a href="simulator.html">Simulator</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
    <div class="button-row">
      <button class="btn ghost small" data-sound-toggle aria-pressed="true">Sound: on</button>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/report.js"></script>
<script src="js/results.js"></script>
</body>
</html>
